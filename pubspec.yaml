name: lib
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: ^1.1.11
  media_kit_libs_windows_audio: ^1.0.4
  media_kit_libs_android_audio: ^1.0.5
  google_fonts: ^6.2.1
  audio_service: ^0.18.15
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.3
  shared_preferences: ^2.3.3
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/background.png
    - assets/radio_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

